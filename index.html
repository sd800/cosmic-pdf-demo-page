<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Object-Oriented Architecture · Course materials</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f6f7f9;
      --surface: #ffffff;
      --text: #242a34;
      --muted: #69717e;
      --border: #e1e5eb;
      --accent: #3567ad;
      --accent-soft: #edf2fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #191b20;
        --surface: #22252c;
        --text: #ecebe9;
        --muted: #abb2be;
        --border: #363c47;
        --accent: #9bbcef;
        --accent-soft: #2b374b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(720px, calc(100% - 48px));
      margin: clamp(72px, 17vh, 160px) auto;
    }
    header { padding-bottom: 28px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 34px); line-height: 1.25; font-weight: 600; }
    header p { margin: 9px 0 0; color: var(--muted); }
    .lecture {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 28px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
    }
    .lecture:hover { border-color: var(--accent); }
    .lecture:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .number {
      display: grid;
      place-items: center;
      flex: 0 0 48px;
      height: 56px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 20px;
      font-weight: 600;
    }
    .details { flex: 1; min-width: 0; }
    h2 { margin: 0; font-size: 19px; line-height: 1.4; font-weight: 600; }
    .details p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
    .open { flex-shrink: 0; color: var(--accent); font-size: 15px; }
    @media (max-width: 520px) {
      .lecture { padding: 20px; gap: 15px; flex-wrap: wrap; }
      .open { margin-left: 63px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Object-Oriented Architecture</h1>
      <p>Course materials</p>
    </header>
    <a class="lecture" href="lecture.5.slides.pdf" type="application/pdf" aria-label="Open Lecture 5: Message brokers and Apache Camel (PDF)">
      <span class="number" aria-hidden="true">05</span>
      <div class="details">
        <h2>Lecture 5</h2>
        <p>Message brokers &amp; Apache Camel</p>
      </div>
      <span class="open">Open PDF <span aria-hidden="true">→</span></span>
    </a>
  </main>
</body>
</html>
